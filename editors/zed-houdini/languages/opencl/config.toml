# Houdini's OpenCL kernels and snippets: OpenCL C plus @-bindings and #bind.
# Only .cl is claimed; .h files stay with C/C++ so other projects are unaffected.
name = "Houdini OpenCL"
grammar = "houdini_opencl"
path_suffixes = ["cl"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 4
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["@"]
