# APEX Script uses Python syntax. "python" is Zed's built-in native grammar, so this
# extension declares no [grammars.python] entry and ordinary Python files are unaffected.
name = "APEX Script"
grammar = "python"
path_suffixes = ["apex"]
line_comments = ["# "]
tab_size = 4
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "f\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "f'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "\"\"\"", end = "\"\"\"", close = true, newline = false, not_in = ["string"] },
  { start = "'''", end = "'''", close = true, newline = false, not_in = ["string"] },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
auto_indent_using_last_non_empty_line = false
increase_indent_pattern = "^[^#].*:\\s*(#.*)?$"
decrease_indent_patterns = [
  { pattern = "^\\s*elif\\b.*:\\s*(#.*)?", valid_after = ["if", "elif"] },
  { pattern = "^\\s*else\\b.*:\\s*(#.*)?", valid_after = ["if", "elif", "for"] },
]
